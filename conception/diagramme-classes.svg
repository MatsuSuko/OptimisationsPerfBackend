<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif" font-size="12">
  <title>Diagramme de Classes Métier – Open Food Facts</title>

  <rect width="980" height="620" fill="#f8f9fa" rx="8"/>
  <text x="490" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Diagramme de Classes Métier – Open Food Facts</text>

  <!-- PRODUIT -->
  <rect x="330" y="50" width="320" height="370" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="2"/>
  <rect x="330" y="50" width="320" height="28" rx="6" fill="#4a6fa5"/>
  <text x="490" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Produit</text>
  <line x1="330" y1="78" x2="650" y2="78" stroke="#4a6fa5" stroke-width="1"/>
  <text x="340" y="93" fill="#333" font-size="11">- id : Long</text>
  <text x="340" y="108" fill="#333" font-size="11">- nom : String</text>
  <text x="340" y="123" fill="#333" font-size="11">- nutritionGradeFr : String</text>
  <text x="340" y="138" fill="#333" font-size="11">- energie100g : Double</text>
  <text x="340" y="153" fill="#333" font-size="11">- graisse100g : Double</text>
  <text x="340" y="168" fill="#333" font-size="11">- sucres100g : Double</text>
  <text x="340" y="183" fill="#333" font-size="11">- fibres100g : Double</text>
  <text x="340" y="198" fill="#333" font-size="11">- proteines100g : Double</text>
  <text x="340" y="213" fill="#333" font-size="11">- sel100g : Double</text>
  <text x="340" y="228" fill="#333" font-size="11">- vitA/D/E/K/C/B1/B2/PP/B6/B9/B12 : Double</text>
  <text x="340" y="243" fill="#333" font-size="11">- calcium100g : Double</text>
  <text x="340" y="258" fill="#333" font-size="11">- magnesium100g : Double</text>
  <text x="340" y="273" fill="#333" font-size="11">- iron100g : Double</text>
  <text x="340" y="288" fill="#333" font-size="11">- fer100g : Double</text>
  <text x="340" y="303" fill="#333" font-size="11">- betaCarotene100g : Double</text>
  <text x="340" y="318" fill="#333" font-size="11">- presenceHuilePalme : Boolean</text>
  <line x1="330" y1="328" x2="650" y2="328" stroke="#4a6fa5" stroke-width="1"/>
  <text x="340" y="343" fill="#555" font-size="11">- categorie : Categorie</text>
  <text x="340" y="358" fill="#555" font-size="11">- marque : Marque</text>
  <text x="340" y="373" fill="#555" font-size="11">- ingredients : List&lt;Ingredient&gt;</text>
  <text x="340" y="388" fill="#555" font-size="11">- allergenes : List&lt;Allergene&gt;</text>
  <text x="340" y="403" fill="#555" font-size="11">- additifs : List&lt;Additif&gt;</text>

  <!-- CATEGORIE -->
  <rect x="30" y="55" width="200" height="80" rx="6" fill="#ffffff" stroke="#e07b39" stroke-width="2"/>
  <rect x="30" y="55" width="200" height="28" rx="6" fill="#e07b39"/>
  <text x="130" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Categorie</text>
  <line x1="30" y1="83" x2="230" y2="83" stroke="#e07b39" stroke-width="1"/>
  <text x="40" y="98" fill="#333" font-size="11">- id : Long</text>
  <text x="40" y="113" fill="#333" font-size="11">- nom : String «unique»</text>

  <!-- MARQUE -->
  <rect x="30" y="185" width="200" height="80" rx="6" fill="#ffffff" stroke="#e07b39" stroke-width="2"/>
  <rect x="30" y="185" width="200" height="28" rx="6" fill="#e07b39"/>
  <text x="130" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Marque</text>
  <line x1="30" y1="213" x2="230" y2="213" stroke="#e07b39" stroke-width="1"/>
  <text x="40" y="228" fill="#333" font-size="11">- id : Long</text>
  <text x="40" y="243" fill="#333" font-size="11">- nom : String «unique»</text>

  <!-- INGREDIENT -->
  <rect x="730" y="55" width="200" height="80" rx="6" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
  <rect x="730" y="55" width="200" height="28" rx="6" fill="#2e8b57"/>
  <text x="830" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Ingredient</text>
  <line x1="730" y1="83" x2="930" y2="83" stroke="#2e8b57" stroke-width="1"/>
  <text x="740" y="98" fill="#333" font-size="11">- id : Long</text>
  <text x="740" y="113" fill="#333" font-size="11">- nom : String «unique»</text>

  <!-- ALLERGENE -->
  <rect x="730" y="195" width="200" height="80" rx="6" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
  <rect x="730" y="195" width="200" height="28" rx="6" fill="#2e8b57"/>
  <text x="830" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Allergene</text>
  <line x1="730" y1="222" x2="930" y2="222" stroke="#2e8b57" stroke-width="1"/>
  <text x="740" y="237" fill="#333" font-size="11">- id : Long</text>
  <text x="740" y="252" fill="#333" font-size="11">- nom : String «unique»</text>

  <!-- ADDITIF -->
  <rect x="730" y="335" width="200" height="80" rx="6" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
  <rect x="730" y="335" width="200" height="28" rx="6" fill="#2e8b57"/>
  <text x="830" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Additif</text>
  <line x1="730" y1="362" x2="930" y2="362" stroke="#2e8b57" stroke-width="1"/>
  <text x="740" y="377" fill="#333" font-size="11">- id : Long</text>
  <text x="740" y="392" fill="#333" font-size="11">- nom : String «unique»</text>

  <!-- Relations -->
  <line x1="330" y1="95" x2="230" y2="95" stroke="#e07b39" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="230,91 220,95 230,99" fill="#e07b39"/>
  <text x="255" y="88" font-size="10" fill="#e07b39">N</text>
  <text x="225" y="88" font-size="10" fill="#e07b39">1</text>

  <line x1="330" y1="225" x2="230" y2="225" stroke="#e07b39" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="230,221 220,225 230,229" fill="#e07b39"/>
  <text x="255" y="218" font-size="10" fill="#e07b39">N</text>
  <text x="225" y="218" font-size="10" fill="#e07b39">1</text>

  <line x1="650" y1="95" x2="730" y2="95" stroke="#2e8b57" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="730,91 740,95 730,99" fill="#2e8b57"/>
  <text x="655" y="88" font-size="10" fill="#2e8b57">N</text>
  <text x="732" y="88" font-size="10" fill="#2e8b57">N</text>

  <line x1="650" y1="235" x2="730" y2="235" stroke="#2e8b57" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="730,231 740,235 730,239" fill="#2e8b57"/>
  <text x="655" y="228" font-size="10" fill="#2e8b57">N</text>
  <text x="732" y="228" font-size="10" fill="#2e8b57">N</text>

  <line x1="650" y1="350" x2="730" y2="375" stroke="#2e8b57" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="730,371 740,375 730,379" fill="#2e8b57"/>
  <text x="655" y="346" font-size="10" fill="#2e8b57">N</text>
  <text x="732" y="370" font-size="10" fill="#2e8b57">N</text>

  <!-- Légende -->
  <rect x="30" y="520" width="420" height="80" rx="6" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="45" y="540" font-size="11" font-weight="bold" fill="#333">Légende</text>
  <line x1="45" y1="555" x2="90" y2="555" stroke="#e07b39" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="90,551 100,555 90,559" fill="#e07b39"/>
  <text x="105" y="559" font-size="11" fill="#333">Association N→1 (ManyToOne)</text>
  <line x1="45" y1="578" x2="90" y2="578" stroke="#2e8b57" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="90,574 100,578 90,582" fill="#2e8b57"/>
  <text x="105" y="582" font-size="11" fill="#333">Association N↔N (ManyToMany)</text>
</svg>
