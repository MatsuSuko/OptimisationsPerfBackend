# =============================================
# Configuration base de données MySQL
# =============================================
# spring.datasource.url=jdbc:mysql://localhost:3306/open_food_facts?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Création automatique des tables au démarrage
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Cache Spring simple en mémoire pour accélérer les recherches répétées
spring.cache.type=simple
spring.cache.cache-names=categoriesByName,brandsByName,ingredientsByName,allergensByName,additivesByName,topProductsByBrand,topProductsByCategory,topProductsByBrandAndCategory,topIngredients,topAllergens,topAdditives

# =============================================
# Alternative H2 en mémoire (décommenter pour tester sans MySQL)
# =============================================
spring.datasource.url=jdbc:h2:file:./data/openfoodfacts
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 pour inspecter la base depuis le navigateur
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# Chemin vers le fichier CSV Open Food Facts
# =============================================
etl.csv.path=src/main/resources/open-food-facts.csv

# Déclenche automatiquement l'import du CSV au démarrage si la base est vide
etl.run-on-startup=true
